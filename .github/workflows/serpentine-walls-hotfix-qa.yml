name: Serpentine Walls Hotfix QA

on:
  push:
    branches: [hotfix/serpentine-walls]

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node tests/serpentine-walls.mjs
      - run: npm run build
