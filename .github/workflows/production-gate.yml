name: Production Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-gate-main
  cancel-in-progress: true

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: End-to-End 24x24 Regression QA
        run: node tests/end-to-end-regression.mjs
      - name: Wave Director QA
        run: node tests/wave-director.mjs
      - name: Sudden Siege Calibration QA
        run: node tests/sudden-siege-calibration.mjs
      - name: Tower Range QA
        run: node tests/tower-range.mjs
      - name: Tower Synergy Feedback QA
        run: node tests/tower-synergy-feedback.mjs
      - name: Last Bastion Sync QA
        run: node tests/last-bastion-sync.mjs
      - name: Last Bastion Final Result QA
        run: node tests/last-bastion-final-result.mjs
      - name: Last Bastion Spectate QA
        run: node tests/last-bastion-spectate.mjs
      - name: Gameplay Feedback QA
        run: node tests/game-feedback.mjs
      - name: Install Playwright QA runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production preview for browser QA
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/bastionfall-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bastionfall-preview.log
          exit 1
      - name: Accessibility responsive QA
        run: node tests/accessibility-responsive.mjs
      - name: Tower placement mouse QA
        run: node tests/tower-placement-mouse.mjs
      - name: Boot production server and verify health
        env:
          PORT: 3000
          NODE_ENV: production
          MATCH_TOKEN_SECRET: ci-production-gate-secret
        run: |
          nohup npm start > /tmp/bastionfall-production.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bastionfall-production.log
          exit 1
      - name: Promote verified commit to Railway production branch
        run: |
          git push origin HEAD:refs/heads/railway-production --force
      - name: Verify promoted commit is live in production
        env:
          PRODUCTION_HEALTH_URL: https://bastionfall-web-production.up.railway.app/api/health
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for i in {1..60}; do
            body="$(curl -fsS "$PRODUCTION_HEALTH_URL" || true)"
            if echo "$body" | grep -q "\"ok\":true" && echo "$body" | grep -q "\"revision\":\"$EXPECTED_SHA\""; then
              echo "$body"
              exit 0
            fi
            sleep 5
          done
          echo "Expected revision $EXPECTED_SHA was not observed in production."
          curl -fsS "$PRODUCTION_HEALTH_URL" || true
          exit 1
